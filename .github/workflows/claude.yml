# 在 issue / PR 的评论里写 @claude，Claude 读代码、回答、改代码：issue 上开新分支、改完开 PR；同仓库的 PR 上直接推到 PR 的分支。
# 只有仓库的 owner、成员、协作者写的才启动（下面的 if；陌生人的评论连机器都不开）。
# 用 Claude Agent SDK（.github/claude/agent.mjs），不用 claude-code-action：后者算 Claude Code 用量，console 里的赠送额度不管它。
# 密钥在仓库的 Secret ANTHROPIC_API_KEY，只给 agent 那一步；GitHub 的 token 只给准备和收尾两步，Claude 碰不到。
# 跑在 macOS 上：Grove 只能在 macOS 上编译和测试，Claude 改完可以自己 go vet / go test。
# 这类事件只认默认分支上的这份文件（和 .github/claude/），改了要合进 main 才生效。
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

env:
  GOTOOLCHAIN: auto # go.mod 要 go 1.27.3

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false # 不把 token 留在 .git/config 里，Claude 推不了；推送在收尾一步

      # 脚本先拷走：PR 上会切到 PR 的分支，跑的仍是 main 上的这份
      - name: 拷出脚本
        run: cp -R .github/claude "$RUNNER_TEMP/claude"

      - name: 准备
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/claude/prepare.sh"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 装 Agent SDK
        run: npm ci --prefix "$RUNNER_TEMP/claude" --no-audit --no-fund

      - name: Claude
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node "$RUNNER_TEMP/claude/agent.mjs" "$RUNNER_TEMP/claude-prompt.md" "$RUNNER_TEMP/claude-reply.md" "$RUNNER_TEMP/claude-meta.json"

      - name: 收尾
        if: always() && steps.prep.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          AGENT: ${{ steps.agent.outcome }}
          NUM: ${{ steps.prep.outputs.num }}
          BRANCH: ${{ steps.prep.outputs.branch }}
          NEW: ${{ steps.prep.outputs.new }}
          BASE: ${{ steps.prep.outputs.base }}
          START: ${{ steps.prep.outputs.start }}
          CID: ${{ steps.prep.outputs.cid }}
        run: bash "$RUNNER_TEMP/claude/finish.sh"

      # 收尾推送失败时改动还在这里（finish.sh 推送前打的 bundle）
      - name: 留存改动
        if: always() && steps.prep.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: claude-work
          path: ${{ runner.temp }}/claude-work.bundle
          retention-days: 7
          if-no-files-found: ignore
